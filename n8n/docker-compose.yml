# /opt/stacks/n8n sur la VM Docker (192.168.1.14).
# Acces : LAN et Tailscale uniquement (comme Paperless), jamais public.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.5
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file: .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - ./data:/home/node/.n8n
      # Dossier temporaire utilise par installer.sh
      - ./import:/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Acces SSH de Jarvis a l'infra (lecture bridee + actions validees par Louis).
  # n8n l'appelle sur http://jarvis-ssh:8001 ; NPM publie les pages de
  # validation (port 8001 de la VM) derriere Authentik.
  jarvis-ssh:
    build: ./jarvis-ssh
    image: majordome/jarvis-ssh:local
    restart: unless-stopped
    env_file: jarvis-ssh.env
    ports:
      - "8001:8001"
    volumes:
      - ./jarvis-ssh-data:/data
      - ./jarvis-ssh/config.yaml:/app/config.yaml:ro

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      retries: 5
